  build: ">=3.0.2 <4.0.0"
  carburetor: ^0.1.0
  source_gen: ">=3.1.0 <5.0.0"
  glob: ^2.1.0
  json_annotation: ^4.9.0

dev_dependencies:
  lints: ^5.0.0
  json_serializable: ^6.10.0
